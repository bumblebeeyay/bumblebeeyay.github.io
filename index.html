<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bee's Garden</title>
    <meta name="description" content="A little garden of projects. Follow the bee, visit the flowers." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&display=swap"
    />
  </head>
  <body>
    <!-- Rough, hand-cut edges for the wooden boards. -->
    <svg class="visually-hidden" aria-hidden="true">
      <filter id="rough-edge">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" />
        <feDisplacementMap in="SourceGraphic" scale="9" />
      </filter>
    </svg>

    <div id="app"></div>
    <noscript>The garden needs JavaScript to grow. 🌱</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
